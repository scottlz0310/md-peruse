# カバレッジの集計方針。RustとFrontendをflagsで分けて追跡する。
# CIの各ジョブがOIDCで認証してlcovをアップロードする（.github/workflows/ci.yml）。
# Rustのテストは Phase 4 のコア実装と併せて追加するため、当面カバレッジは低い値になる。
# 実装が揃うまでステータスはinformationalとし、Pull Requestをブロックしない。

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

flags:
  rust:
    paths:
      - src-tauri/src/
    carryforward: true
  frontend:
    paths:
      - src/
    carryforward: true

comment:
  layout: "condensed_header, flags, files"
  require_changes: true

ignore:
  - "dist/**"
  - "docs/**"
  - "test/**"
  - "src-tauri/gen/**"
  - "src-tauri/target/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
