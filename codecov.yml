# カバレッジの集計方針。RustとFrontendをflagsで分けて追跡する。
# FrontendのDOMテスト構成はPhase 2で確立した（design-decisions.md 14.5）。
# アップロードのCIへの組み込みはPhase 2の残タスクであり、開始するまで実施しない。
# アップロード開始までステータスをinformationalとし、PRをブロックしない。

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

flags:
  rust:
    paths:
      - src-tauri/src/
    carryforward: true
  frontend:
    paths:
      - src/
    carryforward: true

comment:
  layout: "condensed_header, flags, files"
  require_changes: true

ignore:
  - "dist/**"
  - "docs/**"
  - "src-tauri/gen/**"
  - "src-tauri/target/**"
