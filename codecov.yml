# Coverage aggregation policy. Rationale: docs/design-decisions.md 4.11.
# Keep this file ASCII-only: on Windows runners the codecov CLI reads it as
# cp1252 and fails on non-ASCII bytes.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

flags:
  rust:
    paths:
      - src-tauri/src/
    carryforward: true
  frontend:
    paths:
      - src/
    carryforward: true

comment:
  layout: "condensed_header, flags, files"
  require_changes: true

ignore:
  - "dist/**"
  - "docs/**"
  - "test/**"
  - "src-tauri/gen/**"
  - "src-tauri/target/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
