<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>md-peruse Mock</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-titlebar: #1f1f1f;
      --bg-sidebar: #252526;
      --bg-preview: #1e1e1e;
      --border-color: #3e3e42;
      --text-main: #cccccc;
      --text-bright: #ffffff;
      --text-muted: #858585;
      --hover-bg: #2a2d2e;
      --selected-bg: #37373d;
      --accent-color: #007acc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--text-main);
      background-color: var(--bg-titlebar);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    header {
      background-color: var(--bg-titlebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .titlebar {
      display: flex;
      align-items: center;
      height: 35px;
      padding: 0 12px;
      gap: 16px;
    }

    .app-title { font-size: 12px; font-weight: 700; color: #4ec9b0; letter-spacing: 0.5px; }
    .menu-bar { display: flex; gap: 4px; }
    .menu-item { padding: 3px 8px; border-radius: 4px; cursor: pointer; }
    .menu-item:hover { background-color: var(--hover-bg); color: var(--text-bright); }

    .breadcrumb-bar {
      height: 28px;
      background-color: var(--bg-sidebar);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      color: var(--text-muted);
      gap: 6px;
    }

    .breadcrumb-item:hover { color: var(--text-bright); text-decoration: underline; cursor: pointer; }
    .breadcrumb-separator { opacity: 0.5; }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* 左ペイン */
    .sidebar {
      width: 260px;
      min-width: 140px;
      max-width: 600px;
      background-color: var(--bg-sidebar);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .tree-view { list-style: none; }
    .tree-node {
      display: flex;
      align-items: center;
      padding: 4px 8px;
      cursor: pointer;
      white-space: nowrap;
      border-left: 2px solid transparent;
    }
    .tree-node:hover { background-color: var(--hover-bg); }
    .tree-node.active {
      background-color: var(--selected-bg);
      color: var(--text-bright);
      border-left-color: var(--accent-color);
    }

    .toggle-icon {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-family: monospace;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .tree-icon { margin-right: 6px; font-size: 13px; }
    .tree-label { overflow: hidden; text-overflow: ellipsis; }
    .tree-children { display: none; list-style: none; }
    .tree-children.expanded { display: block; }

    /* 中央リサイザー (スライダー) */
    .resizer {
      width: 4px;
      background-color: var(--border-color);
      cursor: col-resize;
      transition: background-color 0.15s;
      z-index: 10;
    }
    .resizer:hover, .resizer.dragging {
      background-color: var(--accent-color);
    }

    /* 右ペイン */
    .preview-container {
      flex: 1;
      background-color: var(--bg-preview);
      overflow-y: auto;
      padding: 32px 48px;
      user-select: text;
    }

    .markdown-body { max-width: 860px; margin: 0 auto; line-height: 1.6; color: #c9d1d9; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: #f0f6fc; margin-top: 24px; margin-bottom: 16px; font-weight: 600;
      border-bottom: 1px solid #30363d; padding-bottom: 0.3em;
    }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin-bottom: 16px; }
    .markdown-body ul, .markdown-body ol { padding-left: 2em; }
    .markdown-body code {
      background-color: rgba(110, 118, 129, 0.4);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 85%;
    }
    .markdown-body pre {
      background-color: #161b22;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
      border: 1px solid #30363d;
    }
    .markdown-body pre code { background-color: transparent; padding: 0; }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 16px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #30363d;
      padding: 6px 13px;
    }
    .markdown-body th { background-color: #161b22; }
    .markdown-body blockquote {
      padding: 0 1em;
      color: #8b949e;
      border-left: 0.25em solid #30363d;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="titlebar">
      <span class="app-title">md-peruse</span>
      <div class="menu-bar">
        <div class="menu-item">ファイル(F)</div>
        <div class="menu-item">表示(V)</div>
        <div class="menu-item">ヘルプ(H)</div>
      </div>
    </div>
    <div class="breadcrumb-bar" id="breadcrumb"></div>
  </header>

  <div class="main-container" id="mainContainer">
    
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">エクスプローラー</div>
      <ul class="tree-view" id="fileTree"></ul>
    </aside>

    <div class="resizer" id="dragResizer"></div>

    <main class="preview-container">
      <article class="markdown-body" id="previewArea"></article>
    </main>

  </div>

  <script>
    const fileStructure = [
      {
        name: "docs",
        type: "folder",
        children: [
          {
            name: "SPECIFICATION.md",
            type: "file",
            path: ["md-peruse", "docs", "SPECIFICATION.md"],
            content: `# md-peruse 仕様設計

軽量・高速な閲覧専用Markdownビューワーのアーキテクチャ概要と設計方針です。

## 1. 基本方針
- **閲覧特化:** 編集機能を排除し、起動速度とメモリフットプリントを最優先。
- **UI構造:** Windowsエクスプローラー + PowerToysプレビュー調の2ペイン構成（中央スライダー付き）。
- **技術スタック:** **Tauri v2 (Rust + WebView2 / Web Frontend)**

---

## 2. アーキテクチャ構成

### Core / Backend (Rust / Tauri)
- **ファイルシステム走査:** \`walkdir\` または \`std::fs\` によるディレクトリツリーの高速走査・JSONシリアライズ
- **Tauri Commands:**
  - \`open_folder_dialog()\`: フォルダ選択ダイアログの表示 (\`tauri-plugin-dialog\`)
  - \`get_file_tree(root_path)\`: 指定パス以下のファイル一覧取得
  - \`read_file_content(path)\`: 対象ファイルのUTF-8テキストストリーミング読み込み

### Frontend (TypeScript + HTML/CSS)
- **UIレイアウト:**
  - タイトルバー / メニュー / パンくずリスト
  - 左ペイン: VS Codeライクな展開型ファイルツリー
  - 中央: マウスドラッグ対応のスプリッターバー
  - 右ペイン: レンダリング済みMarkdownプレビュー
- **Parser:** \`marked.js\`（またはWasm / Rust側の \`pulldown-cmark\`）

---

## 3. 配布 & CI/CD パイプライン
- **パッケージ形式:** MSIX
- **配信・更新方式:** Microsoft Storeへ登録し、Microsoftの署名付きパッケージとして配信。更新はMicrosoft Storeに委任（\`.appinstaller\`は使用しない）
- **CI/CD方針:** 初回登録のみ手動で申請し、以降の更新版はCI/CDからMicrosoft Storeへ自動申請する`
          },
          {
            name: "CHANGELOG.md",
            type: "file",
            path: ["md-peruse", "docs", "CHANGELOG.md"],
            content: `# 更新履歴

## v0.2.0
- プロジェクト名を **md-peruse** に決定
- 中央スライダーバー（ペインリサイズ機能）を追加
- 技術スタック選定ドキュメント（Tauri構成仕様）を反映

## v0.1.0
- 初回UIモック作成（2ペイン・VS Code風ツリー）`
          }
        ]
      }
    ];

    const treeContainer = document.getElementById("fileTree");
    const previewArea = document.getElementById("previewArea");
    const breadcrumb = document.getElementById("breadcrumb");
    const sidebar = document.getElementById("sidebar");
    const resizer = document.getElementById("dragResizer");
    const container = document.getElementById("mainContainer");

    let isDragging = false;

    resizer.addEventListener("mousedown", (e) => {
      isDragging = true;
      resizer.classList.add("dragging");
      document.body.style.cursor = "col-resize";
    });

    document.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const containerRect = container.getBoundingClientRect();
      let newWidth = e.clientX - containerRect.left;
      
      if (newWidth < 140) newWidth = 140;
      if (newWidth > 600) newWidth = 600;

      sidebar.style.width = `${newWidth}px`;
    });

    document.addEventListener("mouseup", () => {
      if (isDragging) {
        isDragging = false;
        resizer.classList.remove("dragging");
        document.body.style.cursor = "default";
      }
    });

    function createTree(items, container, depth = 0) {
      items.forEach(item => {
        const li = document.createElement("li");
        if (item.type === "folder") {
          const node = document.createElement("div");
          node.className = "tree-node";
          node.style.paddingLeft = `${depth * 12 + 8}px`;
          node.innerHTML = `<span class="toggle-icon">▼</span><span class="tree-icon">📁</span><span class="tree-label">${item.name}</span>`;
          
          const childUl = document.createElement("ul");
          childUl.className = "tree-children expanded";
          
          node.addEventListener("click", () => {
            const isExpanded = childUl.classList.toggle("expanded");
            node.querySelector(".toggle-icon").textContent = isExpanded ? "▼" : "▶";
          });

          li.appendChild(node);
          li.appendChild(childUl);
          createTree(item.children, childUl, depth + 1);
        } else {
          const node = document.createElement("div");
          node.className = "tree-node file-node";
          node.style.paddingLeft = `${depth * 12 + 8}px`;
          node.innerHTML = `<span class="toggle-icon"></span><span class="tree-icon">📄</span><span class="tree-label">${item.name}</span>`;

          node.addEventListener("click", () => {
            document.querySelectorAll(".file-node").forEach(el => el.classList.remove("active"));
            node.classList.add("active");
            renderFile(item);
          });
          li.appendChild(node);
        }
        container.appendChild(li);
      });
    }

    function renderFile(file) {
      previewArea.innerHTML = marked.parse(file.content);
      breadcrumb.innerHTML = file.path.map((seg, idx) => {
        const isLast = idx === file.path.length - 1;
        return `<span class="breadcrumb-item" style="${isLast ? 'color: var(--text-bright);' : ''}">${seg}</span>` +
               (!isLast ? `<span class="breadcrumb-separator">&gt;</span>` : '');
      }).join('');
    }

    createTree(fileStructure, treeContainer);
    renderFile(fileStructure[0].children[0]);
    document.querySelectorAll(".file-node")[0].classList.add("active");
  </script>
</body>
</html>
