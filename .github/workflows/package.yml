name: Package

# x64 版の MSIX を生成し、WACK（Windows App Certification Kit）の結果とともに artifact へ保存する。
# 必須CIには含めない（Store 提出前の検証用）。手動起動、リリースタグ、winapp CLI の更新 PR で動かす。
# ここで署名する証明書は、このジョブで作る開発用の自己署名であり、Store 配布には使えない。
# Store へ出す提出物は Partner Center の署名に任せ、このジョブの MSIX は WACK と内容確認に使う。

on:
  workflow_dispatch:
  # winapp CLI の更新 PR だけで動かし、更新で生成と WACK が壊れないことを PR で確かめる。対象は、
  # Renovate（renovate[bot]）が同じリポジトリのブランチから出し、`winapp-cli` ラベルを付けた PR に限る
  # （renovate.json の winapp CLI のルールが付ける）。ブランチ名は、更新の種類で接頭辞が変わる
  # （renovate/patch-...、renovate/minor-...）ため、条件に使わない。ほかの PR では、下の job の if で
  # 起動しない（手動起動で足りる）。
  pull_request:
    # Renovate は PR を作成した後に、別の API 呼び出しでラベルを付ける。opened のイベントには
    # `winapp-cli` ラベルがないため、labeled も契機にする（types を省かない既定の3種類を明示する）。
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # winapp CLI の初回起動バナーと利用状況の送信を止める。
  WINAPP_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  msix:
    name: MSIX と WACK
    # labeled は、ほかのラベルの追加でも起動する。`winapp-cli` ラベルの追加だけを対象にして、同じ PR の
    # 実行が重複しないようにする（concurrency の cancel-in-progress は、skip になる実行でも、実行中の
    # 検証を取り消すため使わない）。
    if: >-
      github.event_name != 'pull_request' || (
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'winapp-cli') &&
      (github.event.action != 'labeled' || github.event.label.name == 'winapp-cli'))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: バージョンの一致を検査
        run: bun run check:versions

      # winapp CLI は package.json の devDependencies（@microsoft/winappcli）に固定し、上の
      # bun install が導入する（Windows でのみ）。版の照合は scripts/build-msix.ps1 が行う。

      # tauri build の beforeBuildCommand が、サードパーティライセンス一覧の生成（generate:licenses）に使う。
      - uses: taiki-e/install-action@cargo-about

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: MSIX を生成
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Sign

      # WACK は署名済みパッケージを導入して検査する。開発用証明書を信頼済みにしておく。
      - name: 開発用証明書を信頼
        shell: pwsh
        run: |
          $pfx = Get-ChildItem devcert.pfx
          $password = ConvertTo-SecureString 'password' -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $password | Out-Null

      - name: WACK を実行
        shell: pwsh
        run: |
          $msix = (Get-ChildItem build/msix -Filter '*.msix' | Select-Object -First 1).FullName
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { throw "appcert.exe が見つかりません: $appcert" }
          New-Item -ItemType Directory -Path build/wack -Force | Out-Null
          & $appcert reset
          & $appcert test -appxpackagepath $msix -reportoutputpath (Join-Path (Get-Location) 'build/wack/wack-report.xml')
          # 終了コードは、検査が完了したことと合否を区別しない。合否は報告書の OVERALL_RESULT で判断する。
          Write-Host "appcert exit $LASTEXITCODE"
          $report = 'build/wack/wack-report.xml'
          if (-not (Test-Path $report)) { throw 'WACK の報告書が生成されませんでした' }
          $result = ([xml](Get-Content $report -Raw)).REPORT.OVERALL_RESULT
          Write-Host "WACK OVERALL_RESULT: $result"
          if ($result -ne 'PASS') { throw "WACK が合格していません: $result（報告書は artifact に保存する）" }

      - name: MSIX のハッシュを記録
        shell: pwsh
        run: |
          Get-ChildItem build/msix -Filter '*.msix' | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content build/msix/SHA256SUMS.txt -Encoding utf8NoBOM

      # WACK が不合格でも、報告書を読めるよう保存する。
      - name: artifact へ保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: md-peruse-msix-x64
          path: |
            build/msix/*.msix
            build/msix/SHA256SUMS.txt
            build/wack/wack-report.xml
          if-no-files-found: error
          retention-days: 30
