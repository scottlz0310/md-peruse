name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Codecov へのアップロードをOIDCで認証するため、id-tokenの発行を許可する。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: Lint と Formatting を検査
        run: bun run check

      - name: 型検査
        run: bun run typecheck

      - name: テスト
        run: bun run test:coverage

      - name: カバレッジをアップロード
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Frontend をビルド
        run: bun run build

  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      # tauri::generate_context! が frontendDist（dist/）を埋め込むため、
      # Rust の検査より先に Frontend をビルドする必要がある。
      - name: Frontend をビルド
        run: bun run build

      # rustup は rust-toolchain.toml のチャネルとコンポーネントを自動で導入する。
      - name: ツールチェーンを確認
        run: rustc --version && cargo --version
        working-directory: src-tauri

      # キャッシュの保存は main に限定する。GitHub Actionsのキャッシュはブランチスコープであり、
      # PRブランチが保存したものは他ブランチから復元できないため、保存しても再利用されない。
      # main へのpushで更新したキャッシュを、すべてのPRが復元して利用する。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting を検査
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - uses: taiki-e/install-action@cargo-llvm-cov

      # cargo llvm-cov はテスト実行とカバレッジ計測を兼ねるため、cargo test を置き換える。
      - name: テストとカバレッジ計測
        run: cargo llvm-cov --lcov --output-path lcov.info
        working-directory: src-tauri

      # Codecov CLI は設定ファイルをシステムのANSIコードページで読むため、Windows上では
      # 非ASCIIを含む codecov.yml でデコードに失敗する。アップロードは Coverage ジョブ
      # （ubuntu）へ委ね、このジョブでは計測結果の受け渡しだけを行う。
      - name: カバレッジをartifactへ保存
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: src-tauri/lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: rust-lcov

      - name: カバレッジをアップロード
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: lcov.info
          flags: rust
          fail_ci_if_error: true

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      # cargo-about は Cargo.lock とcrateのメタデータだけを読むため、
      # Windowsターゲットの一覧をLinuxランナー上で生成できる。
      - uses: taiki-e/install-action@cargo-about

      - name: ライセンス一覧を生成
        run: bun run generate:licenses

      - name: 生成物が最新か検査
        run: git diff --exit-code -- src/generated/third-party-licenses.json
