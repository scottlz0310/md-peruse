name: Prepare Release

# リリース準備 PR（`chore(release): vX.Y.Z`）を作る。手動起動だけで動く。
# release-automate が、Bot（GitHub App）名義で次をまとめた PR を出す。
#   - package.json、src-tauri/tauri.conf.json、src-tauri/Cargo.toml、src-tauri/Cargo.lock の版
#   - CHANGELOG.md の [Unreleased] を、リリースの版の見出しに確定
# その前に、Store 掲載データの ReleaseNotes が前回のリリースから変わっていることを検査し、変わっていなければ止める。
# この PR を squash マージすると、release.yml が動く（タグ、Release、Store への提出）。
# 手順と運用は docs/store-submission.md 9章。

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "リリースする安定版（例: 0.1.1）。MAJOR.MINOR.PATCH の形式のみ"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # MSIX の Package Version は 4 つの整数で、プレリリース版を持てない。scripts/check-versions.ts も
      # MAJOR.MINOR.PATCH だけを受け付ける。release-automate は rc などの版も通すため、ここで止める。
      - name: 安定版の形式を確認
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          if ! [[ "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::target_version は MAJOR.MINOR.PATCH の形式で指定してください（先頭に v は付けない）: $TARGET_VERSION"
            exit 1
          fi

  # Store 掲載データの ReleaseNotes が、前回のリリースから変わっていることを確かめる。リリースの流れの
  # store ジョブは、タグが指すコミットの listingData.csv をパッケージと一緒に出すので、更新を忘れると、
  # 古い「新機能」の文が公開される。人が守る手順に頼らず、ここで止める（scripts/check-release-listing.ts）。
  listing:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: ReleaseNotes の更新を確認
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v*')"
          bun scripts/check-release-listing.ts "$previous"

  prepare:
    needs: [validate, listing]
    uses: scottlz0310/release-automate/.github/workflows/reusable-prepare-release.yml@3b5092d9f1a7ed9f29fb33f6e598d1e8534bb8cf # v2.1.0
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
    with:
      target_version: ${{ inputs.target_version }}
      bump_strategy: tauri
