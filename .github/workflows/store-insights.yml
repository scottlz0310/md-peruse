name: Store Insights

# Partner Center の Insights API（アプリとゲームの分析データ）を呼ぶ。手動起動だけで動かす。目的は、継続収集の
# 設計の前提（SDK のカスタムイベントを返すデータセットがあるか、版別・日別の標準 Sessions が取れるか）を、
# 実走で確かめること。
#
# 承認の基準（2026-10-12 にユーザーが決めた）: 承認（Environment `store-production` の Required reviewers）を
# 残すのは、不可逆な操作と、外部への書き込みを伴う作業だけ。読み取りだけのモードは、承認のない Environment
# `store-readonly` で動かす。`store-readonly` の資格情報は、書き込みもできる強さなので、書き込まないことは、
# `--read-only` と、読み取り専用のクライアント（scripts/store/client.ts の `readOnly`）が強制する。
# モードの分類の正本は scripts/store/insights.ts の READ_ONLY_MODES / WRITE_MODES で、このワークフローの
# ジョブの分け方との一致は scripts/store/workflows.test.ts が検査する。
#
#   読み取りだけ（`read` ジョブ。承認なし。`store-readonly`）
#     datasets   : `Get Datasets` の応答（データセットと列）を証跡に残す
#     usage-status: 作成済みのレポート（`report_id`）の実行の状態だけを見直す。新しいレポートは作らない。
#                状態の指定なしと、状態ごとの一覧の応答を証跡に残す。CSV は取得しない（日別の値を、公開の
#                artifact・ログ・Step Summary に出さないため。日別の取得と保存は store-usage-archive.yml）
#   Partner Center へ書き込む（`write` ジョブ。承認あり。`store-production`）
#     usage-schedule: UsageDaily（直近 30 日・日次）を、Partner Center に週次（168 時間ごと）・52 回（約 1 年）
#                繰り返し実行させるレポートを 1 件作る。各実行が直近 30 日分を含むので、週次でも日別の欠けは出ない。
#                開始は、実行の約 4 時間 10 分後（API が 4 時間以上先を求める）。
#                起動のたびに 1 件増える（1 ユーザー 40 件の上限）ので、作り直すとき以外は起動しない。
#                出た reportId を、リポジトリの変数 STORE_USAGE_REPORT_ID に設定する（store-usage-archive.yml が使う）。
#                実行の状態は usage-status で、reportId を指定して確かめる

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "datasets: データセットと列を調べる（読み取りだけ。承認なし） / usage-status: 作成済みのレポートの実行の状態を見直す（読み取りだけ。承認なし。report_id が必要） / usage-schedule: 繰り返し実行するレポートを 1 件作る（Partner Center に書き込む。起動のたびに 1 件増える。承認あり）"
        type: choice
        options: [datasets, usage-status, usage-schedule]
        default: datasets
      report_id:
        description: "usage-status で見直すレポートの reportId（usage-schedule の Step Summary に出る）"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: store-insights
  cancel-in-progress: false

# `read` と `write` は、同じ手順で、違いは Environment と `--read-only` だけ。片方を直したら、もう片方も直す。
jobs:
  read:
    name: Insights API を読む（${{ inputs.mode }}。承認なし）
    if: ${{ inputs.mode == 'datasets' || inputs.mode == 'usage-status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: store-readonly
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # 資格情報を渡すジョブなので、依存関係をインストールしない（scripts/store は Bun の標準ライブラリだけで動く）。
      - name: Insights API を読む
        env:
          MODE: ${{ inputs.mode }}
          REPORT_ID: ${{ inputs.report_id }}
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: bun run scripts/store/insights.ts --read-only --mode "$MODE" --report-id "$REPORT_ID" --evidence-dir "$RUNNER_TEMP/insights-evidence"

      # 失敗しても保存する。資格情報を渡すステップとは分ける。
      - name: 証跡を保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: insights-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/insights-evidence
          if-no-files-found: warn
          retention-days: 90

  write:
    name: Insights API へ書き込む（${{ inputs.mode }}。承認あり）
    if: ${{ inputs.mode == 'usage-schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: store-production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # 資格情報を渡すジョブなので、依存関係をインストールしない（scripts/store は Bun の標準ライブラリだけで動く）。
      - name: Insights API へ書き込む
        env:
          MODE: ${{ inputs.mode }}
          REPORT_ID: ${{ inputs.report_id }}
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: bun run scripts/store/insights.ts --mode "$MODE" --report-id "$REPORT_ID" --evidence-dir "$RUNNER_TEMP/insights-evidence"

      # 失敗しても保存する。資格情報を渡すステップとは分ける。
      - name: 証跡を保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: insights-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/insights-evidence
          if-no-files-found: warn
          retention-days: 90
