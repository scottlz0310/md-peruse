name: Release

# リリース準備 PR（prepare-release.yml が作る `chore(release): vX.Y.Z`）を squash マージすると動く。
# release-automate が draft の Release とタグを作り、続けて次の順に進む。
#   draft → Package（MSIX と WACK）→ 成果物の添付 → Release から再取得して照合 → Release の公開
#   → Store への提出（Environment `store-production` の承認）
# リリース準備 PR 以外の main への push では、draft ジョブが skip され、後続のジョブも動かない。
#
# release-automate のタグは GITHUB_TOKEN で作られ、`push: tags` の別のワークフローを起動しない。
# そのため Package は、タグの push ではなく、ここから呼ぶ（package.yml の workflow_call）。
#
# 失敗したときは、同じ実行で「Re-run failed jobs」を使う（新しいタグを切らない）。Release の公開の後に
# Store の提出だけが失敗した場合も同じで、公開済みの Release は変更しない。
# 手順と運用は docs/store-submission.md 9章。

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  draft:
    # `chore(release):` で始まるコミット以外は、release-automate 側の条件で skip される。
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@3b5092d9f1a7ed9f29fb33f6e598d1e8534bb8cf # v2.1.0
    permissions:
      contents: write
    with:
      draft: true

  package:
    needs: draft
    if: needs.draft.outputs.release_state == 'draft'
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.draft.outputs.tag_name }}

  # Store へ出すものと同じファイルを、Release にも添付する（成果物の同一性）。
  # MSIX は開発用の自己署名で、配布には使えないため、添付しない。
  attach:
    needs: [draft, package]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: md-peruse-msix-x64
          path: artifact

      - name: draft の Release へ成果物を添付
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifact -type f \( -name '*.msixupload' -o -name SHA256SUMS.txt -o -name wack-report.xml \))
          if [[ ${#files[@]} -ne 3 ]]; then
            echo "::error::添付する成果物が 3 つではありません: ${files[*]}"
            exit 1
          fi
          # 再実行で重複しないよう、既存の同名の asset は置き換える。
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    needs: [draft, attach]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      # draft の Release は、push 権限のある資格情報でないと取得できない。ここでは読み取りだけを行う。
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: md-peruse-msix-x64
          path: expected

      - name: Release から成果物を再取得して照合
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir actual
          gh release download "$TAG" --dir actual --repo "$GITHUB_REPOSITORY"

          mapfile -t names < <(find expected -type f \( -name '*.msixupload' -o -name SHA256SUMS.txt -o -name wack-report.xml \) -printf '%f\n' | sort)
          mapfile -t attached < <(find actual -type f -printf '%f\n' | sort)
          if [[ "${names[*]}" != "${attached[*]}" || ${#names[@]} -ne 3 ]]; then
            echo "::error::Release の asset が、Package の成果物と一致しません。期待: ${names[*]}、実際: ${attached[*]}"
            exit 1
          fi

          for name in "${names[@]}"; do
            expected_hash=$(sha256sum "$(find expected -type f -name "$name")" | cut -d' ' -f1)
            actual_hash=$(sha256sum "actual/$name" | cut -d' ' -f1)
            if [[ "$expected_hash" != "$actual_hash" ]]; then
              echo "::error::$name の SHA-256 が Package の成果物と一致しません"
              exit 1
            fi
          done

          # SHA256SUMS.txt（Package が記録した値）に、.msixupload のハッシュがあること。
          upload=$(printf '%s\n' "${names[@]}" | grep -E '\.msixupload$')
          upload_hash=$(sha256sum "actual/$upload" | cut -d' ' -f1)
          if ! grep -i -F -q "$upload_hash  $upload" actual/SHA256SUMS.txt; then
            echo "::error::SHA256SUMS.txt に $upload の SHA-256 の記録がありません"
            exit 1
          fi
          echo "照合しました: $upload ($upload_hash)"

  finalize:
    needs: [draft, verify]
    if: needs.draft.outputs.release_state == 'draft'
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@3b5092d9f1a7ed9f29fb33f6e598d1e8534bb8cf # v2.1.0
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.draft.outputs.tag_name }}
      target_sha: ${{ needs.draft.outputs.target_sha }}

  # Release の公開の後に、同じ .msixupload を Store へ出す。承認（Environment の必須レビュアー）を通るまで、
  # 資格情報は渡らない。公開方法は、Partner Center の設定が Immediate のとき（認定の後に自動で公開）の
  # 前提で、違えば scripts/store が止まる。
  store:
    needs: [draft, finalize]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: store-production
    # 申請（下書き）は 1 つしか持てない。store-submit.yml と同時に動かさない。
    concurrency:
      group: store-submit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/download-artifact@v8
        with:
          name: md-peruse-msix-x64
          path: artifact

      # 資格情報を渡すジョブなので、依存関係をインストールしない（scripts/store は Bun の標準ライブラリだけで動く）。
      - name: Store へ提出
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          set -euo pipefail
          mapfile -t uploads < <(find artifact -type f -name '*.msixupload')
          if [[ ${#uploads[@]} -ne 1 ]]; then
            echo "::error::提出する .msixupload が 1 つではありません: ${uploads[*]}"
            exit 1
          fi
          bun run store:submit --package "${uploads[0]}" --publish-mode Immediate --apply
