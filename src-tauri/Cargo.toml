[package]
name = "md-peruse"
version = "0.1.0"
description = "閲覧専用Markdownビューワー"
authors = ["scottlz0310"]
license = "MIT"
repository = "https://github.com/scottlz0310/md-peruse"
edition = "2024"
rust-version = "1.85"

[lib]
# `_lib` suffix は Windows で bin 名と衝突させないために必要
# https://github.com/rust-lang/cargo/issues/8519
name = "md_peruse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"
# OSの表示言語の取得に使う（design-decisions.md 10.5）。Tauriが依存する版と揃えており、
# 重複してコンパイルされない。
windows = { version = "0.62.2", features = ["Win32_Globalization"] }
# ファイル変更監視（design-decisions.md 6.4）。Windowsでは ReadDirectoryChangesW を使う。
# `default-features = false` はmacOS向けのFSEventsを外すためであり、Windowsの
# バックエンドは既定機能に依存しない。畳み込みは自前の規則で行うため
# （6.5、`src/watch.rs` の `coalesce`）、notify-debouncer-full は使わない。
notify = { version = "8.2.0", default-features = false }
# 画像ヘッダーからの形式判定と寸法取得（design-decisions.md 7.3）。デコーダーを持つcrateを
# 使わないのは、上限の判定に必要なのが宣言された寸法だけであり、デコードすると上限で
# 防ごうとしているメモリをその場で確保してしまうためである。機能は許可形式のものだけへ
# 絞る。列挙にない形式は判定されず、そのまま拒否になる。
imagesize = { version = "0.15.0", default-features = false, features = [
  "bmp",
  "gif",
  "heif",
  "jpeg",
  "png",
  "webp",
] }
# 画像resource IDの生成（design-decisions.md 5.4）。IDはワークスペース単位のソルトを鍵とし、
# 相対パスと変更世代を入力とするHMAC-SHA256である。ソルトは推測されないことが要件のため、
# スコープID（`watch_runtime.rs`）のように `RandomState` から作らず、OSの乱数源から直接取る。
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"

[dev-dependencies]
# `tauri::test::mock_app` を使うために `test` feature を足す（design-decisions.md 14.2）。
# dev-dependencies の feature は通常ビルドへ波及しないため、製品バイナリには入らない。
tauri = { version = "2.11.5", features = ["test"] }
# アクセラレータ文字列を実際のパーサーで検証するために使う。Tauriが内部で使う
# muda と同じ系列へ解決させる（cargo は semver 互換なら1つへ統一する）。
muda = "0.19.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
