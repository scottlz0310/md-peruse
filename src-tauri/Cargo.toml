[package]
name = "md-peruse"
version = "0.1.0"
description = "閲覧専用Markdownビューワー"
authors = ["scottlz0310"]
license = "MIT"
repository = "https://github.com/scottlz0310/md-peruse"
edition = "2024"
rust-version = "1.85"

[lib]
# `_lib` suffix は Windows で bin 名と衝突させないために必要
# https://github.com/rust-lang/cargo/issues/8519
name = "md_peruse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"

[dev-dependencies]
# アクセラレータ文字列を実際のパーサーで検証するために使う。Tauriが内部で使う
# muda と同じ系列へ解決させる（cargo は semver 互換なら1つへ統一する）。
muda = "0.19.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
